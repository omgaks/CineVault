name: Test coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit tests, lint and build verification
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      # CI-HARDEN-2:
      # One Gradle invocation verifies tests, coverage, release lint and that
      # the current source can actually assemble into an installable debug APK.
      # Keeping these tasks in one invocation lets Gradle reuse the task graph
      # and avoids starting a fresh daemon/process for each quality gate.
      - name: Run CI quality gates
        run: bash gradlew test jacocoTestReport lintRelease assembleDebug --no-daemon

      # New code must not introduce new lint issues.
      # Existing issues are frozen in app/lint-baseline.xml.
      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: lint-report-${{ github.run_number }}
          path: |
            app/build/reports/lint-results-release.html
            app/build/reports/lint-results-release.xml
          if-no-files-found: warn
          retention-days: 14

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-coverage-${{ github.run_number }}
          path: |
            app/build/reports/tests/
            app/build/reports/jacoco/
          if-no-files-found: warn
          retention-days: 14

      # If all gates pass, preserve the exact debug APK produced by this run.
      # This is a verification artifact only; release publishing remains in
      # build.yml and still requires the deliberate workflow_dispatch flow.
      - name: Upload verified debug APK
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: cinevault-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
