name: Anime4K Device Test APK

on:
  push:
    branches: [feat/hdr-anime4k-completion, picture-engine]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: anime4k-device-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
      # A distinct application ID allows side-by-side installation without
      # touching the user's existing signed CineVault or its private data.
      - name: Set separate test application ID
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("app/build.gradle.kts")
          text = path.read_text()
          original = 'applicationId = "com.sole.cinevault"'
          assert text.count(original) == 1, "Unexpected application ID configuration"
          path.write_text(text.replace(original, 'applicationId = "com.sole.cinevault.anime4ktest"'))
          PY
      # Fixed test-only key so each test build installs over the previous one.
      # Not the release key; the release build keeps its own secret keystore.
      - name: Use fixed test signing key
        run: |
          base64 -d .github/test-signing/debug.keystore.b64 > test-debug.keystore
      # Same API keys as the release build, so the test app can fetch genres, posters and
      # ratings. Without them the picture engine cannot tell anime from film.
      - name: Inject API keys from secrets
        run: |
          echo "TMDB_TOKEN=${{ secrets.TMDB_TOKEN }}" >> local.properties
          echo "OMDB_API_KEY=${{ secrets.OMDB_API_KEY }}" >> local.properties
          echo "FANART_API_KEY=${{ secrets.FANART_API_KEY }}" >> local.properties
          echo "OPENSUB_API_KEY=${{ secrets.OPENSUB_API_KEY }}" >> local.properties
          echo "SUBDL_API_KEY=${{ secrets.SUBDL_API_KEY }}" >> local.properties
      - name: Build device-test APK
        run: |
          bash gradlew assembleDebug --no-daemon
          # Fail the build if the fixed key was not used, so a bad key never ships silently.
          keytool -printcert -jarfile app/build/outputs/apk/debug/*.apk | grep "SHA256:" || true
      - name: Upload installable APK
        uses: actions/upload-artifact@v6
        with:
          name: CineVault-Anime4K-device-test-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publish APK as a pre-release download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="picture-test-${{ github.run_number }}"
          cp app/build/outputs/apk/debug/*.apk "CineVault-Picture-Test-${{ github.run_number }}.apk"
          gh release create "$TAG" "CineVault-Picture-Test-${{ github.run_number }}.apk" \
            --prerelease --target "${{ github.sha }}" \
            --title "Picture test build ${{ github.run_number }}" \
            --notes "Test build (installs as Anime4K Device Test, separate from CineVault). Commit ${{ github.sha }}."
