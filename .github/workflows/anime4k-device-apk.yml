name: Anime4K Device Test APK

on:
  push:
    branches: [feat/hdr-anime4k-completion]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: anime4k-device-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
      - name: Build device-test APK
        run: bash gradlew assembleDebug --no-daemon
      - name: Upload installable APK
        uses: actions/upload-artifact@v6
        with:
          name: CineVault-Anime4K-device-test-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
