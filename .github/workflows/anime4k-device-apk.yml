name: Anime4K Device Test APK

on:
  push:
    branches: [feat/hdr-anime4k-completion, fix/picture-local-metadata-diagnostics]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: anime4k-device-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      # Manual refresh of the Anime4K test APK after enabling guarded upscaling.
      - name: Check out source
        uses: actions/checkout@v5
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
      # A distinct application ID allows side-by-side installation without
      # touching the user's existing signed CineVault or its private data.
      - name: Set separate test application ID
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("app/build.gradle.kts")
          text = path.read_text()
          original = 'applicationId = "com.sole.cinevault"'
          assert text.count(original) == 1, "Unexpected application ID configuration"
          path.write_text(text.replace(original, 'applicationId = "com.sole.cinevault.anime4ktest"'))
          PY
      - name: Build device-test APK
        run: bash gradlew assembleDebug --no-daemon
      - name: Upload installable APK
        uses: actions/upload-artifact@v6
        with:
          name: CineVault-Anime4K-device-test-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
