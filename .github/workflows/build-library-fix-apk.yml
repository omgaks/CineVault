name: Build and release library-fix APK

# Builds a signed library-fix test APK from this branch.
# Includes library fixes without merging the separate FFmpeg rescue PR.
# Uploads a release APK artifact and publishes a prerelease.
on:
  push:
    branches: [fix/episode-and-actor-library-match]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare existing release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          python3 - <<'PY'
          import os, base64
          from pathlib import Path
          required = ("KEYSTORE_BASE64", "KEYSTORE_PASSWORD", "KEY_ALIAS", "KEY_PASSWORD")
          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              raise SystemExit("Missing signing secrets: " + ", ".join(missing))
          key = Path("cinevault-release.jks")
          key.write_bytes(base64.b64decode("".join(os.environ["KEYSTORE_BASE64"].split()), validate=True))
          key.chmod(0o600)
          print("Existing release signing key prepared.")
          PY

      - name: Include existing metadata API configuration
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
          OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
          FANART_API_KEY: ${{ secrets.FANART_API_KEY }}
          OPENSUB_API_KEY: ${{ secrets.OPENSUB_API_KEY }}
          SUBDL_API_KEY: ${{ secrets.SUBDL_API_KEY }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          keys = ("TMDB_TOKEN", "OMDB_API_KEY", "FANART_API_KEY", "OPENSUB_API_KEY", "SUBDL_API_KEY")
          def escape(value):
              return value.replace(chr(92), chr(92) * 2).replace(chr(10), chr(92) + "n").replace(chr(13), chr(92) + "r")
          Path("local.properties").write_text(
              "".join(name + "=" + escape(os.environ.get(name, "")) + chr(10) for name in keys),
              encoding="utf-8",
          )
          print("Metadata API configuration written.")
          PY

      - name: Build and test release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:lintRelease :app:assembleRelease --no-daemon

      - name: Verify release APK signing
        run: |
          APK=$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -type f | head -n 1)
          test -n "$APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          "$APKSIGNER" verify --print-certs "$APK"

      - name: Remove temporary signing and API files
        if: always()
        run: rm -f cinevault-release.jks local.properties

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: CineVault-Library-Fix-Release-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -type f | head -n 1)
          test -n "$APK"
          TAG="library-fix-${GITHUB_SHA::8}"
          gh release create "$TAG" "$APK#CineVault-Library-Fix.apk" --target "$GITHUB_SHA" --title "CineVault Library Fix ${GITHUB_SHA::8}" --notes "Pre-release APK for Cyberpunk TV grouping and actor matching device verification. Does not include the separate unmerged FFmpeg rescue PR." --prerelease
